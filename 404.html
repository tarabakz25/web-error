<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — ページが見つかりません</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:#000;
  color:#fff;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.page{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}
.pivot{
  position:absolute;
  left:50%;
  top:50%;
  will-change:left,top;
}
.rotator{
  animation:spin .35s linear infinite;
  transform-origin:0 0;
  will-change:transform;
}
.code{
  position:absolute;
  left:-1.5ch;
  top:-0.5em;
  margin:0;
  font-size:70vmin;
  font-weight:700;
  line-height:1;
  letter-spacing:0;
  font-variant-numeric:tabular-nums;
  color:#fff;
  white-space:nowrap;
  user-select:none;
  transition:color .15s ease;
}
.digit{display:inline-block;width:1ch;text-align:center}
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
</style>
</head>
<body>
<main class="page">
<div class="pivot">
  <div class="rotator">
    <h1 class="code" aria-label="404">
      <span class="digit">4</span><span class="digit">0</span><span class="digit">4</span>
    </h1>
  </div>
</div>
</main>
<script>
(() => {
  const pivot = document.querySelector('.pivot');
  const code = document.querySelector('.code');
  const colors = ['#fff', '#ff3864', '#3d8bfd', '#3dd68c', '#ffdd57', '#b86bff', '#ff8c42', '#3ee7e3'];
  let colorIdx = 0;
  const speed = 100; 

  let x = innerWidth / 2;
  let y = innerHeight / 2;
  const angle = Math.random() * Math.PI * 2;
  let vx = Math.cos(angle) * speed;
  let vy = Math.sin(angle) * speed;

  function setPos() {
    pivot.style.left = `${x}px`;
    pivot.style.top = `${y}px`;
  }

  function bounce() {
    code.style.color = colors[colorIdx++ % colors.length];
  }

  function clamp() {
    const w = innerWidth;
    const h = innerHeight;
    let hit = false;

    if (x <= 0) {
      x = 0;
      vx = Math.abs(vx);
      hit = true;
    } else if (x >= w) {
      x = w;
      vx = -Math.abs(vx);
      hit = true;
    }

    if (y <= 0) {
      y = 0;
      vy = Math.abs(vy);
      hit = true;
    } else if (y >= h) {
      y = h;
      vy = -Math.abs(vy);
      hit = true;
    }

    if (hit) bounce();
    setPos();
  }

  function tick() {
    x += vx;
    y += vy;
    clamp();
    requestAnimationFrame(tick);
  }

  setPos();
  tick();
  addEventListener('resize', clamp);
})();
</script>
</body>
</html>
