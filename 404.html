<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — ページが見つかりません</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="error-page error-page--404">
    <article class="error-card">
      <p class="error-status">Not Found</p>
      <h1 class="error-code">404</h1>
      <h2 class="error-title">ページが見つかりません</h2>
      <p class="error-message">
        お探しのページは移動または削除されたか、URL が間違っている可能性があります。
      </p>
      <div class="error-actions">
        <a class="btn btn-primary" href="./">トップへ戻る</a>
        <button class="btn btn-secondary" type="button" onclick="history.back()">前のページへ</button>
      </div>
    </article>
  </main>
</body>
</html>
