<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — サーバーエラー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="error-page error-page--500">
    <article class="error-card">
      <p class="error-status">Internal Server Error</p>
      <h1 class="error-code">500</h1>
      <h2 class="error-title">サーバーエラーが発生しました</h2>
      <p class="error-message">
        一時的な問題が発生しています。しばらく時間をおいてから、もう一度お試しください。
      </p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">トップへ戻る</a>
        <button class="btn btn-secondary" type="button" onclick="location.reload()">再読み込み</button>
      </div>
    </article>
  </main>
</body>
</html>
